<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini Live voice test</title>
<style>
  body { background: #2C2C2A; color: #F1EFE8; font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  input, button { font: inherit; border-radius: 10px; border: 0; padding: 10px 12px; }
  input { width: 100%; box-sizing: border-box; background: #444441; color: #F1EFE8; }
  button { background: #AFA9EC; color: #26215C; font-weight: 500; margin-top: 12px; cursor: pointer; }
  label, .dim { color: #B4B2A9; font-size: 14px; }
  #log { margin-top: 16px; white-space: pre-wrap; }
  #stats { margin-top: 12px; }
</style>

<h1 style="font-size:20px;font-weight:500">Gemini Live voice test</h1>
<p class="dim">Use headphones, or the character will hear itself. The key is saved in this browser only.</p>

<label for="key">Gemini API key</label>
<input id="key" type="password" autocomplete="off">
<label for="model">Model</label>
<input id="model" value="gemini-3.8-live">
<button id="toggle">Start conversation</button>

<div id="stats" class="dim" aria-live="polite">Not connected.</div>
<div id="log" aria-live="polite"></div>

<script>
const MODEL_DEFAULT = 'gemini-3.8-live';
const PROMPT = `You are Dana, a nurse coming off a week of night shifts, standing in a coffee queue.
A stranger starts talking to you. Reply as Dana would: friendly, one or two short sentences,
and mention small details about your life that they could ask about. Never act as an assistant.`;

const $ = (id) => document.getElementById(id);
$('key').value = localStorage.getItem('geminiKey') || '';
$('model').value = localStorage.getItem('geminiModel') || MODEL_DEFAULT;

let ws, micCtx, micStream, outCtx, playAt = 0, playing = [];
let startedAt = 0, lastVoiceAt = 0, awaitingReply = false, delays = [], line = null, lineWho = '';

function say(who, text) {
  // Transcripts arrive in pieces; append to the current line while the speaker is the same.
  if (who !== lineWho) { line = document.createElement('div'); $('log').append(line); lineWho = who; line.textContent = who + ': '; }
  line.textContent += text;
}
function note(text) { lineWho = ''; const d = document.createElement('div'); d.className = 'dim'; d.textContent = text; $('log').append(d); }
function stats() {
  const mins = ((Date.now() - startedAt) / 60000).toFixed(1);
  const avg = delays.length ? Math.round(delays.reduce((a, b) => a + b) / delays.length) : null;
  $('stats').textContent = `Connected ${mins} min · replies ${delays.length}` +
    (avg ? ` · reply delay last ${delays.at(-1)} ms, average ${avg} ms` : '');
}

function b64FromInt16(int16) {
  const bytes = new Uint8Array(int16.buffer); let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function playPcm(b64) {
  const bin = atob(b64), int16 = new Int16Array(bin.length / 2);
  for (let i = 0; i < int16.length; i++) int16[i] = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
  const buf = outCtx.createBuffer(1, int16.length, 24000), ch = buf.getChannelData(0);
  for (let i = 0; i < int16.length; i++) ch[i] = int16[i] / 32768;
  const src = outCtx.createBufferSource(); src.buffer = buf; src.connect(outCtx.destination);
  playAt = Math.max(playAt, outCtx.currentTime); src.start(playAt); playAt += buf.duration;
  playing.push(src); src.onended = () => { playing = playing.filter((s) => s !== src); };
}
function stopPlayback() { playing.forEach((s) => s.stop()); playing = []; playAt = 0; }

async function start() {
  const key = $('key').value.trim(), model = $('model').value.trim() || MODEL_DEFAULT;
  if (!key) { $('stats').textContent = 'Enter an API key first.'; return; }
  localStorage.setItem('geminiKey', key); localStorage.setItem('geminiModel', model);
  $('log').textContent = ''; delays = []; lineWho = '';

  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  micCtx = new AudioContext({ sampleRate: 16000 });
  outCtx = new AudioContext({ sampleRate: 24000 });

  ws = new WebSocket('wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=' + encodeURIComponent(key));
  ws.onopen = () => ws.send(JSON.stringify({ setup: {
    model: 'models/' + model,
    generationConfig: { responseModalities: ['AUDIO'] },
    systemInstruction: { parts: [{ text: PROMPT }] },
    inputAudioTranscription: {},
    outputAudioTranscription: {},
  } }));
  ws.onmessage = async (e) => {
    const msg = JSON.parse(typeof e.data === 'string' ? e.data : await e.data.text());
    if (msg.setupComplete) { startedAt = Date.now(); note('Connected. Say hello.'); stats(); startMic(); }
    const sc = msg.serverContent; if (!sc) return;
    if (sc.interrupted) stopPlayback();
    if (sc.inputTranscription?.text) say('You', sc.inputTranscription.text);
    if (sc.outputTranscription?.text) say('Dana', sc.outputTranscription.text);
    for (const part of sc.modelTurn?.parts || []) {
      if (!part.inlineData) continue;
      if (awaitingReply) { delays.push(Date.now() - lastVoiceAt); awaitingReply = false; stats(); }
      playPcm(part.inlineData.data);
    }
  };
  ws.onerror = () => note('Connection error.');
  ws.onclose = (e) => { note(`Closed (${e.code}) ${e.reason || ''}`); stop(); };
  $('toggle').textContent = 'End conversation';
}

function startMic() {
  const src = micCtx.createMediaStreamSource(micStream);
  // ScriptProcessor is deprecated but needs no extra file; fine for a throwaway test.
  const proc = micCtx.createScriptProcessor(2048, 1, 1);
  proc.onaudioprocess = (e) => {
    if (ws?.readyState !== 1) return;
    const f = e.inputBuffer.getChannelData(0), int16 = new Int16Array(f.length); let sum = 0;
    for (let i = 0; i < f.length; i++) { const v = Math.max(-1, Math.min(1, f[i])); int16[i] = v * 32767; sum += v * v; }
    // Reply delay = time from the last loud mic chunk to the first audio back.
    if (Math.sqrt(sum / f.length) > 0.02) { lastVoiceAt = Date.now(); awaitingReply = true; }
    ws.send(JSON.stringify({ realtimeInput: { audio: { data: b64FromInt16(int16), mimeType: 'audio/pcm;rate=16000' } } }));
  };
  src.connect(proc); proc.connect(micCtx.destination);
}

function stop() {
  if (ws && ws.readyState < 2) ws.close(); ws = null;
  micStream?.getTracks().forEach((t) => t.stop()); micStream = null;
  micCtx?.close(); micCtx = null; stopPlayback(); outCtx?.close(); outCtx = null;
  $('toggle').textContent = 'Start conversation';
}

$('toggle').onclick = () => (ws ? stop() : start().catch((err) => { $('stats').textContent = err.message; stop(); }));
</script>
